<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

:root{
    --bg:#F6F1EA;
    --text:#4F453B;
    --accent:#8E7862;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Georgia, serif;
    overflow-x:hidden;
}


/* =====================
   BLAADJES
===================== */

.petals{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.petal{
    position:absolute;

    border-radius:
        100% 20%
        100% 20%;

    opacity:.24;

    box-shadow:
        0 4px 8px rgba(0,0,0,.09);

    animation:
        fall linear infinite,
        sway ease-in-out infinite;

    transform-origin:center;
}

@keyframes fall{
    from{
        translate:0 -150px;
        rotate:0deg;
    }

    to{
        translate:0 120vh;
        rotate:360deg;
    }
}

@keyframes sway{
    0%{
        margin-left:0;
    }

    25%{
        margin-left:8px;
    }

    50%{
        margin-left:-6px;
    }

    75%{
        margin-left:10px;
    }

    100%{
        margin-left:0;
    }
}


/* =====================
   HERO
===================== */

.hero{
    position:relative;
    z-index:5;

    min-height:100vh;
    max-width:1200px;
    margin:0 auto;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:60px 20px;
}

.hero::before{
    content:"❋";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:550px;

    color:rgba(142,120,98,0.05);

    z-index:-1;

    pointer-events:none;

    line-height:1;
}

.kicker{
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--accent);
    font-size:13px;
}

h1{
    margin-top:22px;

    font-size:5rem;
    font-weight:400;
    line-height:1.1;
}

.date{
    margin-top:25px;
    font-size:1.3rem;
}


/* =====================
   COUNTDOWN
===================== */

.timer-grid{
    margin-top:45px;

    display:flex;
    gap:15px;

    justify-content:center;
    flex-wrap:wrap;
}

.timer-box{
    background:white;

    min-width:100px;

    padding:18px;

    border-radius:18px;

    box-shadow:
        0 12px 24px rgba(0,0,0,.06);
}

.timer-box span{
    display:block;

    font-size:2rem;
    font-weight:bold;

    color:var(--accent);
}

.timer-box small{
    color:#8E8376;
}


/* =====================
   CONTENT
===================== */

.section{
    position:relative;
    z-index:5;

    max-width:900px;

    margin:0 auto 60px auto;

    padding:0 20px;
}

.card{
    background:white;

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:
        0 12px 30px rgba(0,0,0,.05);
}

.card h2{
