<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

:root{
    --bg:#F6F1EA;
    --text:#4F453B;
    --accent:#8E7862;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Georgia, serif;
    overflow-x:hidden;
}

/* =====================
   BLAADJES
===================== */

.petals{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
}

.petal{

    position:absolute;

    border-radius:
        100% 20%
        100% 20%;

    opacity:.24;

    box-shadow:
        0 4px 8px rgba(0,0,0,.09);

    animation:
        fall linear infinite,
        drift ease-in-out infinite,
        spin ease-in-out infinite;
}

@keyframes fall{

    from{
        transform:
        translateY(-150px);
    }

    to{
        transform:
        translateY(120vh);
    }
}

@keyframes drift{

    0%{
        transform:
        translateX(0px);
    }

    25%{
        transform:
        translateX(5px);
    }

    50%{
        transform:
        translateX(-4px);
    }

    75%{
        transform:
        translateX(6px);
    }

    100%{
        transform:
        translateX(0px);
    }
}


@keyframes spin{

    0%{
        rotate:0deg;
    }

    50%{
        rotate:180deg;
    }

    100%{
        rotate:360deg;
    }
}

/* =====================
   CONTENT
===================== */

.hero::before{

    content:"❋";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    font-size:550px;

    color:rgba(142,120,98,0.05);

    z-index:-1;

    pointer-events:none;

    line-height:1;
}
    position:relative;
    z-index:5;

    min-height:100vh;

    max-width:1200px;
    margin:auto;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:40px 20px;
}

.kicker{

    letter-spacing:4px;

    text-transform:uppercase;

    color:var(--accent);

    font-size:13px;
}

h1{

    margin-top:20px;

    font-size:5rem;

    font-weight:400;

    line-height:1.15;
}

.date{

    margin-top:25px;

    font-size:1.3rem;
}

.timer-grid{

    margin-top:45px;

    display:flex;

    gap:15px;

    justify-content:center;

    flex-wrap:wrap;
}

.timer-box{

    background:white;

    min-width:100px;

    padding:18px;

    border-radius:18px;

    box-shadow:
        0 12px 24px rgba(0,0,0,.06);
}

.timer-box span{

    display:block;

    font-size:2rem;

    font-weight:bold;

    color:var(--accent);
}

.timer-box small{

    color:#8E8376;
}

.section{

    position:relative;

    z-index:5;

    max-width:900px;

    margin:0 auto 60px auto;

    padding:0 20px;
}

.card{

    background:white;

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:
        0 12px 30px rgba(0,0,0,.05);
}

.card h2{

    color:var(--accent);

    margin-bottom:20px;

    font-weight:400;
}

.card p{
    margin:10px 0;
}

.footer{

    position:relative;

    z-index:5;

    text-align:center;

    padding:60px 20px;

    color:#9A8D7E;
}

@media(max-width:768px){

    h1{
        font-size:2.9rem;
    }

    .timer-box{
        min-width:80px;
    }

    .timer-box span{
        font-size:1.4rem;
    }
}

</style>

</head>

<body>

<div class="petals" id="petals"></div>

<section class="hero">

<div class="kicker">
Welkom op onze trouwwebsite
</div>

<h1>
Samira<br>
&
<br>
Youssef
</h1>

<div class="date">
10 januari 2027
</div>

<div class="timer-grid">

<div class="timer-box">
<span id="days">0</span>
<small>Dagen</small>
</div>

<div class="timer-box">
<span id="hours">0</span>
<small>Uren</small>
</div>

<div class="timer-box">
<span id="minutes">0</span>
<small>Minuten</small>
</div>

<div class="timer-box">
<span id="seconds">0</span>
<small>Seconden</small>
</div>

</div>

</section>

<section class="section">

<div class="card">

<h2>Locatie</h2>

<p>Marrakech Palace Rotterdam</p>

</div>

</section>

<section class="section">

<div class="card">

<h2>Dagplanning</h2>

<p>13:00 Ontvangst</p>
<p>14:00 Ceremonie</p>
<p>18:00 Diner</p>
<p>20:00 Feest</p>

</div>

</section>

<div class="footer">
Inviora
</div>

<script>

/* 250 BLAADJES */

const petalsContainer =
document.getElementById("petals");

for(let i = 0; i < 250; i++){

    const petal =
    document.createElement("div");

    petal.classList.add("petal");

    const isLeft =
    Math.random() > 0.5;

    if(isLeft){

        petal.style.left =
        (Math.random()*15)+"%";

    }else{

        petal.style.right =
        (Math.random()*15)+"%";
    }

    petal.style.top =
    (-Math.random()*9000)+"px";

    petal.style.width =
    (18+Math.random()*28)+"px";

    petal.style.height =
    (10+Math.random()*18)+"px";

    const colors = [
        "#6B0F1A",
        "#7E1422",
        "#8D2230",
        "#5A0B14",
        "#751A2A",
        "#922B3E",
        "#A12B40"
    ];

    petal.style.background =
    colors[
        Math.floor(
            Math.random()*colors.length
        )
    ];

    petal.style.animationDuration =
    `${18+Math.random()*7}s,
     ${4+Math.random()*3}s,
     ${8+Math.random()*6}s`;

    petalsContainer.appendChild(petal);
}

/* TIMER */

const weddingDate =
new Date("2027-01-10T12:00:00").getTime();

function updateCountdown(){

const now =
new Date().getTime();

const diff =
weddingDate - now;

const days =
Math.floor(diff/(1000*60*60*24));

const hours =
Math.floor(
(diff%(1000*60*60*24))
/
(1000*60*60)
);

const minutes =
Math.floor(
(diff%(1000*60*60))
/
(1000*60)
);

const seconds =
Math.floor(
(diff%(1000*60))
/
1000
);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
