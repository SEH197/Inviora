<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;

    background-image:
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=2000");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    font-family:Georgia, serif;
}

.container{
    padding:30px;
    max-width:800px;
}

h1{
    font-size:4rem;
    margin-bottom:10px;
}

h2{
    color:#d8c084;
    font-weight:normal;
    margin-bottom:20px;
}

.date{
    font-size:1.4rem;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(4px);

    padding:20px;
    margin:20px auto;
    border-radius:12px;
    max-width:500px;
}

#countdown{
    font-size:2.5rem;
    font-weight:bold;
    margin-bottom:25px;
}

</style>
</head>

<body>

<div class="container">

    <h1>Samira & Youssef</h1>

    <h2>Wij gaan trouwen</h2>

    <div class="date">
        26 juni 2027
    </div>

    <div id="countdown">
        Laden...
    </div>

    <div class="card">
        <h3>📍 Locatie</h3>
        <p>Marrakech Palace Rotterdam</p>
    </div>

    <div class="card">
        <h3>🕒 Dagplanning</h3>
        <p>13:00 Ontvangst</p>
        <p>14:00 Ceremonie</p>
        <p>18:00 Diner</p>
        <p>20:00 Feest</p>
    </div>

</div>

<script>

const weddingDate = new Date("2027-06-26T12:00:00").getTime();

function updateCountdown() {

    const now = new Date().getTime();
    const distance = weddingDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));

    document.getElementById("countdown").innerHTML =
        days + " dagen te gaan";
}

updateCountdown();
setInterval(updateCountdown, 1000);

</script>

</body>
</html>
