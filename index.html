/* kleurvariaties */

.p2,.p5,.p8,.p11{
    background:#7E1422;
}

.p3,.p6,.p9,.p12{
    background:#8D2230;
}

.p4,.p7,.p10{
    background:#5A0B14;
}

/* verschillende vormen */

.p1,.p7{
    width:28px;
    height:18px;
}

.p2,.p8{
    width:42px;
    height:24px;
}

.p3,.p9{
    width:35px;
    height:28px;
}

.p4,.p10{
    width:38px;
    height:20px;
}

/* vallen */

@keyframes fall{

    from{
        transform:translateY(-150px);
    }

    to{
        transform:translateY(120vh);
    }
}

/* subtiel heen en weer */

@keyframes drift{

    0%{
        margin-left:0px;
    }

    25%{
        margin-left:8px;
    }

    50%{
        margin-left:-6px;
    }

    75%{
        margin-left:10px;
    }

    100%{
        margin-left:0px;
    }
}

/* kantelen */

@keyframes spin{

    0%{
        rotate:0deg;
    }

    25%{
        rotate:80deg;
    }

    50%{
        rotate:-40deg;
    }

    75%{
        rotate:120deg;
    }

    100%{
        rotate:360deg;
    }
}

/* alleen aan de randen */

.p1{left:0.5%;top:-100px;animation-duration:18s,7s,11s;}
.p2{left:1.5%;top:-300px;animation-duration:24s,8s,13s;}

const weddingDate = new Date("2027-01-10T12:00:00").getTime();

const days =

const hours =
Math.floor((diff % (1000*60*60*24))

Math.floor((diff % (1000*60*60))
/ (1000*60));

Math.floor((diff % (1000*60))
/ 1000);

document.getElementById("hours").innerHTML = hours;

}
