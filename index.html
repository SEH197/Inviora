<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

:root{
    --bg:#F5F0E8;
    --beige:#E7DDD0;
    --beige-dark:#CDBEAA;
    --brown:#7A5B3B;
    --brown-dark:#5D4530;
    --text:#4D4034;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Georgia", serif;
    background: var(--bg);
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* Achtergrond patroon */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
    radial-gradient(circle at center,
    rgba(122,91,59,0.05) 0,
    transparent 60%),

    linear-gradient(
        45deg,
        rgba(122,91,59,0.04) 25%,
        transparent 25%,
        transparent 50%,
        rgba(122,91,59,0.04) 50%,
        rgba(122,91,59,0.04) 75%,
        transparent 75%
    );

    background-size:140px 140px;

    z-index:-2;
}

/* Pagina */

.wrapper{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

/* Marokkaanse toog */

.arch{
    position:relative;

    max-width:700px;
    margin:40px auto;

    background:linear-gradient(
        180deg,
        #8b6945,
        #755536
    );

    border:12px solid #6a4b2f;

    padding:60px 40px;

    border-radius:
    350px 350px 25px 25px /
    450px 450px 25px 25px;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.12);
}

/* patroon in de toog */

.arch::before{
    content:"✦ ✧ ✦ ✧ ✦ ✧ ✦";

    position:absolute;
    top:18px;
    left:50%;

    transform:translateX(-50%);

    letter-spacing:14px;

    color:rgba(255,255,255,0.30);

    font-size:20px;
}

.arch-inner{
    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,255,255,0.05),
            rgba(255,255,255,0.05) 2px,
            transparent 2px,
            transparent 20px
        );

    border-radius:20px;

    padding:40px;

    text-align:center;

    background-color:#f7f2eb;
}

/* Sterpatronen hoeken */

.star{
    position:absolute;
    color:rgba(255,255,255,.18);
    font-size:38px;
}

.s1{
    top:80px;
    left:40px;
}

.s2{
    top:80px;
    right:40px;
}

.s3{
    bottom:50px;
    left:45px;
}

.s4{
    bottom:50px;
    right:45px;
}

/* Tekst */

h1{
    font-size:4rem;
    line-height:1.2;
    color:var(--brown-dark);
    font-weight:400;
}

.subtitle{
    margin-top:18px;
    color:#86684A;
    font-size:1.2rem;
    letter-spacing:2px;
}

.date{
    margin-top:25px;
    font-size:1.2rem;
}

#countdown{
    margin-top:25px;
    font-size:2rem;
    font-weight:bold;
    color:#6B5034;
}

/* Kaarten */

.card{
    margin-top:25px;

    background:white;

    border-radius:16px;

    padding:22px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.06);
}

.card h3{
    margin-bottom:12px;
    color:#775A3A;
}

.card p{
    margin:8px 0;
}

/* Footer */

.footer{
    text-align:center;
    margin-top:25px;
    color:#988067;
    font-size:14px;
}

@media(max-width:768px){

    h1{
        font-size:2.8rem;
    }

    .arch{
        padding:40px 15px;
    }

    .arch-inner{
        padding:25px;
    }

}

</style>
</head>

<body>

<div class="wrapper">

<div class="arch">

<span class="star s1">✦</span>
<span class="star s2">✦</span>
<span class="star s3">✦</span>
<span class="star s4">✦</span>

<div class="arch-inner">

<h1>
Samira<br>
&<br>
Youssef
</h1>

<div class="subtitle">
Bismillah
</div>

<div class="date">
26 juni 2027
</div>

<div id="countdown">
Laden...
</div>

<div class="card">
<h3>Locatie</h3>
<p>Marrakech Palace Rotterdam</p>
</div>

<div class="card">
<h3>Dagplanning</h3>

<p>13:00 Ontvangst</p>
<p>14:00 Ceremonie</p>
<p>18:00 Diner</p>
<p>20:00 Feest</p>

</div>

</div>

</div>

<div class="footer">
Inviora
</div>

</div>

<script>

const weddingDate = new Date("2027-06-26T12:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();

    const difference = weddingDate - now;

    const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
    );

    document.getElementById("countdown").innerHTML =
    days + " dagen te gaan";
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
