<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

/* =====================
   BASIS
===================== */

:root{
    --bg:#F6F1EA;
    --text:#4F453B;
    --accent:#8E7862;
    --white:#FFFCF8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Georgia, "Times New Roman", serif;
    overflow-x:hidden;
}


/* =====================
   BLAADJES
===================== */

.petals{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:20;
}

.petal{
    position:absolute;

    border-radius:
        100% 20%
        100% 20%;

    opacity:.24;

    box-shadow:
        0 4px 8px rgba(0,0,0,.09);

    animation:
        fall linear infinite,
        sway ease-in-out infinite;

    transform-origin:center;
}

@keyframes fall{

    from{
        translate:0 -150px;
        rotate:0deg;
    }

    to{
        translate:0 120vh;
        rotate:360deg;
    }
}

@keyframes sway{

    0%{ margin-left:0; }

    25%{ margin-left:8px; }

    50%{ margin-left:-6px; }

    75%{ margin-left:10px; }

    100%{ margin-left:0; }
}


/* =====================
   HERO
===================== */

.hero{
    position:relative;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    padding:20px;

    isolation:isolate;
}


/* =====================
   ALHAMBRA TOOG
===================== */

.arch{
    position:absolute;

    top:0;
    left:50%;

    transform:translateX(-50%);

    width:auto;
    height:100vh;

    max-width:none;

    object-fit:contain;
    object-position:top center;

    z-index:10;

    pointer-events:none;
    user-select:none;
}


/* =====================
   HERO INHOUD
===================== */

.hero-content{
    position:relative;
    z-index:11;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    width:100%;
    max-width:600px;

    padding-top:5vh;
}


/* =====================
   BOVENREGEL
===================== */

.kicker{
    font-size:10px;

    letter-spacing:5px;

    text-transform:uppercase;

    color:var(--accent);

    margin-bottom:27px;
}


/* =====================
   NAMEN
===================== */

.hero-names{
    display:flex;

    flex-direction:column;

    align-items:center;

    line-height:.88;
}

.name{
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:5.2rem;

    font-weight:400;

    letter-spacing:-2px;

    color:var(--text);
}


/* =====================
   AMPERSAND
===================== */

.ampersand{
    font-size:2.1rem;

    font-style:italic;

    font-weight:400;

    color:var(--accent);

    line-height:1.5;

    margin:8px 0;
}


/* =====================
   DATUM
===================== */

.date-line{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:18px;

    margin-top:35px;
}

.date-line > span{
    display:block;

    width:48px;

    height:1px;

    background:
        rgba(142,120,98,.55);
}

.date{
    font-size:.85rem;

    letter-spacing:3px;

    text-transform:uppercase;

    color:var(--accent);

    white-space:nowrap;
}


/* =====================
   COUNTDOWN
===================== */

.timer-grid{
    margin-top:38px;

    display:flex;

    gap:12px;

    justify-content:center;
}

.timer-box{
    background:
        rgba(255,252,248,.88);

    min-width:92px;

    padding:15px 12px;

    border-radius:15px;

    border:
        1px solid
        rgba(142,120,98,.10);

    box-shadow:
        0 10px 25px
        rgba(79,69,59,.07);

    backdrop-filter:
        blur(3px);
}

.timer-box span{
    display:block;

    font-size:1.7rem;

    font-weight:400;

    color:var(--accent);
}

.timer-box small{
    display:block;

    margin-top:3px;

    color:#8E8376;

    font-size:.68rem;

    letter-spacing:.5px;
}


/* =====================
   CONTENT
===================== */

.section{
    position:relative;

    z-index:5;

    max-width:900px;

    margin:60px auto;

    padding:0 20px;
}

.card{
    background:white;

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.05);
}

.card h2{
    color:var(--accent);

    margin-bottom:20px;

    font-weight:400;
}

.card p{
    margin:10px 0;
}


/* =====================
   FOOTER
===================== */

.footer{
    position:relative;

    z-index:5;

    text-align:center;

    padding:60px 20px;

    color:#9A8D7E;
}


/* =====================
   TABLET / MOBIEL
===================== */

@media(max-width:768px){

    .hero{
        min-height:100svh;

        padding:20px 14px;
    }

    /*
       Toog vult schermhoogte.
       Hierdoor blijft de opening
       zo groot mogelijk.
    */

    .arch{
        height:100svh;

        width:auto;

        max-width:none;
    }

    .hero-content{
        max-width:90%;

        padding-top:3vh;
    }

    .kicker{
        font-size:8px;

        letter-spacing:3.5px;

        margin-bottom:20px;
    }

    .name{
        font-size:3.5rem;

        letter-spacing:-1px;
    }

    .ampersand{
        font-size:1.6rem;

        margin:5px 0;
    }

    .date-line{
        gap:10px;

        margin-top:25px;
    }

    .date-line > span{
        width:25px;
    }

    .date{
        font-size:.66rem;

        letter-spacing:1.8px;
    }


    /* countdown */

    .timer-grid{
        width:78%;

        gap:6px;

        margin-top:30px;
    }

    .timer-box{
        min-width:0;

        flex:1;

        padding:11px 4px;

        border-radius:12px;
    }

    .timer-box span{
        font-size:1.25rem;
    }

    .timer-box small{
        font-size:.55rem;
    }


    /* overige content */

    .section{
        margin:35px auto;

        padding:0 16px;
    }

    .card{
        padding:28px 20px;

        border-radius:20px;
    }
}


/* =====================
   KLEINE TELEFOONS
===================== */

@media(max-width:380px){

    .name{
        font-size:3rem;
    }

    .kicker{
        letter-spacing:2.8px;
    }

    .ampersand{
        font-size:1.45rem;
    }

    .date-line > span{
        width:18px;
    }

    .date{
        font-size:.61rem;

        letter-spacing:1.4px;
    }

    .timer-grid{
        width:82%;
    }

    .timer-box span{
        font-size:1.1rem;
    }

    .timer-box small{
        font-size:.5rem;
    }
}

</style>
</head>


<body>


<!-- =====================
     BLAADJES
===================== -->

<div
    class="petals"
    id="petals">
</div>


<!-- =====================
     HERO
===================== -->

<section class="hero">


    <!-- TRANSPARANTE TOOG -->

    <img
        src="toog.png"
        class="arch"
        alt=""
        aria-hidden="true"
    >


    <!-- HERO INHOUD -->

    <div class="hero-content">


        <div class="kicker">
            Wij gaan trouwen
        </div>


        <div class="hero-names">

            <span class="name">
                Samira
            </span>

            <span class="ampersand">
                &amp;
            </span>

            <span class="name">
                Youssef
            </span>

        </div>


        <div class="date-line">

            <span></span>

            <div class="date">
                10 januari 2027
            </div>

            <span></span>

        </div>


        <!-- COUNTDOWN -->

        <div class="timer-grid">

            <div class="timer-box">

                <span id="days">
                    0
                </span>

                <small>
                    Dagen
                </small>

            </div>


            <div class="timer-box">

                <span id="hours">
                    0
                </span>

                <small>
                    Uren
                </small>

            </div>


            <div class="timer-box">

                <span id="minutes">
                    0
                </span>

                <small>
                    Minuten
                </small>

            </div>


            <div class="timer-box">

                <span id="seconds">
                    0
                </span>

                <small>
                    Seconden
                </small>

            </div>

        </div>

    </div>

</section>


<!-- =====================
     LOCATIE
===================== -->

<section class="section">

    <div class="card">

        <h2>
            Locatie
        </h2>

        <p>
            Marrakech Palace Rotterdam
        </p>

    </div>

</section>


<!-- =====================
     DAGPLANNING
===================== -->

<section class="section">

    <div class="card">

        <h2>
            Dagplanning
        </h2>

        <p>
            13:00 Ontvangst
        </p>

        <p>
            14:00 Ceremonie
        </p>

        <p>
            18:00 Diner
        </p>

        <p>
            20:00 Feest
        </p>

    </div>

</section>


<!-- =====================
     FOOTER
===================== -->

<div class="footer">
    Inviora
</div>


<script>

/* =====================
   BLAADJES
===================== */

const petalsContainer =
    document.getElementById("petals");


const colors = [

    "#6B0F1A",

    "#7E1422",

    "#8D2230",

    "#5A0B14",

    "#751A2A",

    "#922B3E",

    "#A12B40"

];


for(let i = 0; i < 80; i++){

    const petal =
        document.createElement("div");


    petal.classList.add("petal");


    const isLeft =
        Math.random() > 0.5;


    if(isLeft){

        petal.style.left =
            (Math.random() * 18) + "%";

    }else{

        petal.style.right =
            (Math.random() * 18) + "%";

    }


    petal.style.top =
        (-Math.random() * 3000) + "px";


    petal.style.width =
        (18 + Math.random() * 28) + "px";


    petal.style.height =
        (10 + Math.random() * 18) + "px";


    petal.style.background =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    petal.style.animationDuration =
        `${18 + Math.random() * 9}s,
         ${4 + Math.random() * 3}s`;


    petalsContainer.appendChild(
        petal
    );

}


/* =====================
   COUNTDOWN
===================== */

const weddingDate =
    new Date(
        "2027-01-10T12:00:00"
    ).getTime();


function updateCountdown(){

    const now =
        new Date().getTime();


    const diff =
        weddingDate - now;


    if(diff <= 0){

        document
            .getElementById("days")
            .textContent = "0";

        document
            .getElementById("hours")
            .textContent = "0";

        document
            .getElementById("minutes")
            .textContent = "0";

        document
            .getElementById("seconds")
            .textContent = "0";

        return;

    }


    const days =
        Math.floor(
            diff /
            (1000 * 60 * 60 * 24)
        );


    const hours =
        Math.floor(
            (diff %
            (1000 * 60 * 60 * 24))
            /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (diff %
            (1000 * 60 * 60))
            /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (diff %
            (1000 * 60))
            /
            1000
        );


    document
        .getElementById("days")
        .textContent = days;


    document
        .getElementById("hours")
        .textContent = hours;


    document
        .getElementById("minutes")
        .textContent = minutes;


    document
        .getElementById("seconds")
        .textContent = seconds;

}


updateCountdown();


setInterval(
    updateCountdown,
    1000
);

</script>


</body>
</html>
