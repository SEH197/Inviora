<!DOCTYPE html>
<html lang="nl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inviora</title>

<style>

:root{
    --bg:#F6F1EA;
    --card:#ffffff;
    --text:#4F453B;
    --accent:#8E7862;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Georgia, serif;
}

/* HERO */

.hero{

    position:relative;

    min-height:900px;

    background-color:var(--bg);

    text-align:center;
}

.arch{

    width:100%;

    max-width:600px;

    display:block;

    margin:0 auto;
}

/* Inhoud in de toog */

.hero-content{

    position:absolute;

    top:140px;

    left:50%;

    transform:translateX(-50%);

    width:100%;

    max-width:500px;

    padding:20px;
}

.hero-content h1{

    font-size:4rem;

    font-weight:400;

    line-height:1.25;
}

.subtitle{

    margin-top:20px;

    letter-spacing:4px;

    font-size:14px;

    color:var(--accent);

    text-transform:uppercase;
}

.date{

    margin-top:25px;

    font-size:1.4rem;
}

/* TIMER */

.timer-grid{

    margin-top:40px;

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;
}

.timer-box{

    background:white;

    min-width:100px;

    padding:18px;

    border-radius:16px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08);
}

.timer-box span{

    display:block;

    font-size:2rem;

    font-weight:bold;

    color:var(--accent);
}

.timer-box small{

    color:#888;
}

/* SECTIES */

.section{

    max-width:900px;

    margin:60px auto;

    padding:0 20px;
}

.card{

    background:white;

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.06);
}

.card h2{

    color:var(--accent);

    margin-bottom:20px;

    font-weight:400;
}

.card p{

    margin:10px 0;
}

/* FOOTER */

.footer{

    text-align:center;

    padding:60px 20px;

    color:#8c7d6a;
}

/* MOBIEL */

@media(max-width:768px){

    .hero{
        min-height:820px;
    }

    .hero-content{

        top:110px;
    }

    .hero-content h1{

        font-size:2.7rem;
    }

    .timer-box{

        min-width:80px;
    }

    .timer-box span{

        font-size:1.4rem;
    }

}

</style>
</head>

<body>

<section class="hero">

    arch.png

    <div class="hero-content">

        <h1>
            Samira<br>
            &<br>
            Youssef
        </h1>

        <div class="subtitle">
            Bismillah
        </div>

        <div class="date">
            10 januari 2027
        </div>

        <div class="timer-grid">

            <div class="timer-box">
                <span id="days">0</span>
                <small>Dagen</small>
            </div>

            <div class="timer-box">
                <span id="hours">0</span>
                <small>Uren</small>
            </div>

            <div class="timer-box">
                <span id="minutes">0</span>
                <small>Minuten</small>
            </div>

            <div class="timer-box">
                <span id="seconds">0</span>
                <small>Seconden</small>
            </div>

        </div>

    </div>

</section>

<section class="section">

    <div class="card">

        <h2>Locatie</h2>

        <p>Marrakech Palace Rotterdam</p>

        <p>
            #
                Route openen →
            </a>
        </p>

    </div>

</section>

<section class="section">

    <div class="card">

        <h2>Dagplanning</h2>

        <p>13:00 Ontvangst</p>
        <p>14:00 Ceremonie</p>
        <p>18:00 Diner</p>
        <p>20:00 Feest</p>

    </div>

</section>

<section class="section">

    <div class="card">

        <h2>RSVP</h2>

        <p>Laat ons weten of je aanwezig bent.</p>

        <button>
            Aanwezigheid Bevestigen
        </button>

    </div>

</section>

<div class="footer">

    Inviora

</div>

<script>

const weddingDate =
new Date("2027-01-10T12:00:00").getTime();

function updateCountdown(){

    const now = new Date().getTime();

    const difference = weddingDate - now;

    const days =
    Math.floor(difference / (1000 * 60 * 60 * 24));

    const hours =
    Math.floor((difference %
    (1000 * 60 * 60 * 24))
    / (1000 * 60 * 60));

    const minutes =
    Math.floor((difference %
    (1000 * 60 * 60))
    / (1000 * 60));

    const seconds =
    Math.floor((difference %
    (1000 * 60))
    / 1000);

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;
}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
